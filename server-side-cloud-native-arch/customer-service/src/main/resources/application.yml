server:
  port: 8083

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://localhost:5432/customerdb
    username: ${DB_USERNAME:authappdb}
    password: ${DB_PASSWORD:PASS123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: "ThisIsADemoSecretKeyForJWTSigningPleaseChangeInProd1234567890"

management:
  endpoints:
    web:
      exposure:
        include: health,info
