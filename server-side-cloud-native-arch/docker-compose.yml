# ---------------------------------------------------------------------------
# Local infra only (Postgres + Redis). The Spring Boot services themselves are run
# with `mvn spring-boot:run` per the README so you can iterate on code
# without rebuilding images every time. Add the services here later with a
# Dockerfile each if you want a fully containerized stack.
#
# Cloud-native / SOA note: each microservice owns a DEDICATED database
# (authdb, productdb, customerdb) inside the same Postgres instance. They are
# never allowed to share tables or query across databases directly — the only
# way product-service learns about a customer is through customer-service's
# HTTP API (Feign). This is the "Database per Service" pattern: it keeps
# services independently deployable and stops hidden coupling through shared
# schemas.
# ---------------------------------------------------------------------------
services:
  postgres:
    image: postgres:16-alpine
    container_name: ms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Shared cache infrastructure. Each service must use its own key prefix;
  # product-service uses "secureauth:product:" to avoid cross-service collisions.
  redis:
    image: redis:7.4-alpine
    container_name: ms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP catcher so email-service can send OTPs without a real mailbox.
  # Web UI: http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: ms-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:
